name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Find build output
        run: |
          echo "===== ROOT ====="
          ls -la

          echo "===== BUILD DIRECTORIES ====="
          find . -maxdepth 5 -type d \
            \( -name dist -o -name .output -o -name build \) \
            -not -path './node_modules/*'

          echo "===== OUTPUT FILES ====="
          for dir in dist .output build .vercel/output; do
            if [ -d "$dir" ]; then
              echo "===== $dir ====="
              find "$dir" -maxdepth 4 -type f | head -100
            fi
          done

      - name: Prepare Pages
        run: |
          echo "===== BUSCANDO INDEX.HTML ====="
          find . -type f -name "index.html" \
            -not -path './node_modules/*' \
            -not -path './.git/*'

          echo "===== CARPETAS GENERADAS ====="
          find . -maxdepth 3 -type d \
            -not -path './node_modules*' \
            -not -path './.git*' \
            | sort

          echo "===== ARCHIVOS DE SALIDA ====="
          find . -maxdepth 4 -type f \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            | sort | tail -200

          exit 1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
