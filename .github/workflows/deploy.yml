name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Check static output
        run: |
          echo "===== OUTPUT ====="
          find .output/public -maxdepth 5 -type f | sort

          echo "===== INDEX FILES ====="
          find .output/public -type f -name "index.html" -print

      - name: Prepare Pages
        run: |
          if [ ! -f ".output/public/index.html" ]; then
            echo "ERROR: No se encontró .output/public/index.html"
            exit 1
          fi

          echo "Página principal encontrada correctamente."
          echo "PAGES_DIR=.output/public" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
