name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Inspect output
        run: |
          echo "===== .output ====="
          find .output -maxdepth 6 -type f | sort

          echo "===== HTML ====="
          find .output -type f \
            \( -name "*.html" -o -name "*.htm" \) \
            -print

          echo "===== PUBLIC ====="
          ls -la .output/public

      - name: Prepare Pages
        run: |
          mkdir -p pages

          if [ -f ".output/public/index.html" ]; then
            cp -r .output/public/* pages/
          else
            HTML_FILE=$(find .output -type f \
              \( -name "*.html" -o -name "*.htm" \) \
              | head -1)

            if [ -n "$HTML_FILE" ]; then
              echo "HTML encontrado:"
              echo "$HTML_FILE"

              cp "$HTML_FILE" pages/index.html

              if [ -d ".output/public/assets" ]; then
                cp -r .output/public/assets pages/
              fi
            else
              echo "ERROR: TanStack Start no ha generado ningún HTML."
              exit 1
            fi
          fi

          echo "===== PAGES ====="
          find pages -maxdepth 3 -type f | sort

          if [ ! -f "pages/index.html" ]; then
            echo "ERROR: No se ha podido crear pages/index.html"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
