name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Check output
        run: |
          echo "===== OUTPUT ====="
          find .output -maxdepth 5 -type f | sort

          echo "===== HTML ====="
          find .output -type f -name "*.html" -print

      - name: Prepare Pages
        run: |
          mkdir -p pages

          if [ -f ".output/public/index.html" ]; then
            echo "Encontrado index.html"
            cp -r .output/public/* pages/
          else
            echo "No existe .output/public/index.html"
            exit 1
          fi

          touch pages/.nojekyll

          echo "===== PAGES ====="
          find pages -maxdepth 3 -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
