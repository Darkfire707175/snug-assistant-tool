name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Prepare Pages
        run: |
          echo "===== BUSCANDO SALIDA ====="
          find . -maxdepth 5 -type f \
            \( -name "index.html" -o -name "*.js" \) \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            | head -200

          if [ -d ".output/public" ]; then
            echo "Encontrado: .output/public"
            echo "PAGES_DIR=.output/public" >> "$GITHUB_ENV"
          elif [ -d "dist" ]; then
            echo "Encontrado: dist"
            echo "PAGES_DIR=dist" >> "$GITHUB_ENV"
          elif [ -d "build" ]; then
            echo "Encontrado: build"
            echo "PAGES_DIR=build" >> "$GITHUB_ENV"
          else
            echo "No se encontró ninguna carpeta de salida."
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PAGES_DIR }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
